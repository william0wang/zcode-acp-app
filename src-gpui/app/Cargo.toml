[package]
name = "app"
description = "Desktop Workbench gpui window layer: entities mirror appStore slices, views bind to protocol events"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
protocol.workspace = true
# The embedded terminal: the vendored gpui-terminal view plus its PTY
# (spawn the login shell, resize, kill). The kit owns the gpui identity;
# these two only extend it (workspace pins in ../Cargo.toml).
gpui-terminal.workspace = true
portable-pty.workspace = true
# The protocol crate deliberately ships no real HTTP stack (its `hub_client`
# module doc names the app layer as the supplier), so the app owns the
# transport plus the tokio driver thread that runs the protocol futures.
# Same workspace pins as protocol — no new external crates.
tokio.workspace = true
serde_json.workspace = true
# readout_store's SessionReadout needs the derives (serde_json alone has
# none); the pin already sits in the workspace tree via protocol.
serde.workspace = true
# The shared mobile/web catalogs (requirements §2) — src/i18n is loaded at
# compile time straight from the TS app's directory, no forked copy. Both
# pins already sit in the workspace tree via gpui-kit's own dependencies.
rust-i18n.workspace = true
sys-locale.workspace = true
# Local-timezone stamps for the config surfaces (local_time.rs); already
# in the workspace tree via gpui-kit's dependencies.
libc.workspace = true
# https:// on remote Connection Profiles: tokio-rustls wraps the transport's
# TcpStream; rustls-native-certs loads the system trust store (the same
# policy the WS side gets from tokio-tungstenite's feature).
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true

[dev-dependencies]
# UI integration tests (gpui-kit TESTING.md / website test guide): test-support
# under dev-dependencies only — features unify for tests, production builds
# never enable observation.
gpui-kit = { workspace = true, features = ["test-support"] }
