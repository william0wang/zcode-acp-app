[package]
name = "app"
version = "0.34.1"
description = "ZCode ACP for Android and the web: attach to a zcode-acp Hub over WebSocket"
authors = ["William Wang"]
license = "MIT"
repository = "https://github.com/william0wang/zcode-acp-app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
